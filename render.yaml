# Render Blueprint: creates the Leash web app and its daily job in one step.
# Render dashboard > New > Blueprint > pick this repository.
# Values marked `sync: false` are asked for when you create the Blueprint; leave any blank to use mock mode.

services:
  # The app itself (pages + API)
  - type: web
    name: leash
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL # e.g. https://leash.onrender.com, so PayPal can send you back after connecting
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DEMO_FORCE_DECLINE
        value: "false"
      - key: DEMO_MODE # public demo: reset button, nightly reset, Claude use capped per visitor
        value: "true"

# The daily job (release reservations nobody answered, run due restocks, keep the database awake)
# is GET /api/keepalive with the header "Authorization: Bearer <CRON_SECRET>". Render cron jobs are
# paid, so it isn't here: call it once a day from any scheduler (a Render cron job, GitHub Actions,
# cron-job.org). Without it, the public demo still resets when someone arrives after a quiet spell,
# and restocks run from "Run now".
